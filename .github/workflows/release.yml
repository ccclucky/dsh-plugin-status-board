# Publish to npm when a GitHub Release is published (option B: the human
# decision is the click on "Publish release"; the tag and the draft release are
# a staging area that can still be edited or deleted).
#
# HOW IT AUTHENTICATES
# ────────────────────
# `NPM_TOKEN` (a repository secret) is the npm credential, passed as
# NODE_AUTH_TOKEN, which is the shape npm's own provenance example uses.
# `id-token: write` is still required and is NOT an alternative credential: it
# lets the runner fetch a Sigstore certificate, which is what makes
# `--provenance` work. Drop it and publishing still succeeds, but the published
# version silently loses its provenance attestation.
#
# WHY THE CHECKS ARE INLINED RATHER THAN REUSING ci.yml
# ─────────────────────────────────────────────────────
# So this job reads end to end as one release decision: the gates that justify
# publishing sit next to the publish they guard. ci.yml stays the gate for every
# push and pull request; this file adds the release-only gates on top.
name: Release

on:
  release:
    types: [published]
  # Manual entry point, dry run by default: runs every gate and build step but
  # never publishes, so the plumbing can be proven on main without shipping.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run all gates and the build, but do not publish
        type: boolean
        default: true

permissions:
  contents: read
  # Not a credential: lets the runner obtain a Sigstore certificate so
  # `npm publish --provenance` can attest where the bytes came from. See the
  # header, and note this is required even though npm auth here is a plain token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here; package.json's `packageManager` is the single source
      # of truth, same as in ci.yml. See that file for why pinning both fails.
      - uses: pnpm/action-setup@v4

      # Node 24 = the build/toolchain floor (see ci.yml). The supported runtime
      # is a separate question and is still Node >=20, asserted by the emitted
      # `target: node20` for the Host half.
      #
      # `registry-url` is load-bearing, not cosmetic: setup-node only writes an
      # `_authToken` entry when it is set, so without it NODE_AUTH_TOKEN is
      # silently ignored and `npm publish` fails with ENEEDAUTH far from the
      # cause.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (includes the loader-envelope smoke check)
        run: pnpm build

      - name: Test
        run: pnpm test

      # ── Release gates ─────────────────────────────────────────────────────
      # These run last on purpose: they are cheap, and reaching them means the
      # artefact is already known good, so a green gate set is a publishable
      # build rather than "a build that might still fail".
      - name: Check that the tag, the manifest and the registry agree
        id: gate
        env:
          # `refs/tags/v1.2.3` on a release event; empty on workflow_dispatch.
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Passed as a length probe only: the token itself stays out of this
          # step, and an empty string is how a missing secret arrives.
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' && 'yes' || '' }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")

          # A manual dry run has no release tag, so the tag gate is asserted
          # against whatever the branch is released from: skip the equality check
          # and say so loudly rather than inventing a passing signal.
          if [ "$EVENT_NAME" = "release" ]; then
            case "$GITHUB_REF_NAME" in
              v[0-9]*) ;;
              *) echo "::error::release tag '$GITHUB_REF_NAME' must start with 'v'"; exit 1 ;;
            esac
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag says v$tag but package.json says $version. The tag is the release; fix the manifest, do not move the tag."
              exit 1
            fi
            echo "tag/package.json agree on $version"
          else
            # No release tag on a manual run, so the equality gate cannot be
            # asserted here. Say so instead of letting a green check imply it was.
            echo "::warning::manual run: the tag==manifest gate is NOT exercised here"
          fi

          # Fail here with a sentence that names the fix, rather than letting
          # `npm publish` report ENEEDAUTH two steps later next to a wall of
          # npm's own stack.
          if [ "$DRY_RUN" != true ] && [ -z "$HAS_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi

          # npm refuses to republish a version, and a failed-but-partial publish
          # would otherwise surface as a confusing 403 much later. Fail early.
          if npm view "dsh-plugin-status-board@$version" version >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$version is already on the registry - expected for a dry run on a released version"
            else
              echo "::error::$version already exists on npm; bump the version before publishing"
              exit 1
            fi
          else
            echo "$version is new to the registry"
          fi

          # A version with a pre-release identifier must not become `latest`.
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          # The only version the rest of the job may use. Deriving it once here
          # means the publish step and the clean-install step cannot disagree
          # with the manifest that was just built.
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the packed file list
        run: npm pack --dry-run

      - name: Publish to npm
        # Written so that a release event publishes without consulting `inputs`
        # at all: on that event the context is absent, and `null == false` would
        # leave the decision to GitHub's type coercion. A manual run publishes
        # only when the dry-run flag is explicitly off.
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        # setup-node turns NODE_AUTH_TOKEN into an `_authToken` line for the
        # configured registry, which is the mechanism npm's own documented
        # provenance workflow uses.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "${{ steps.gate.outputs.dist_tag }}"

      # Proves the published bytes work for a real consumer, in a directory that
      # shares nothing with this checkout. This is the only step that can see a
      # packaging mistake (a missing `files` entry, a bad `exports` map).
      - name: Install the published version in a clean directory
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail

          # Two failure modes look identical from here but are not the same
          # event, and only one of them is a defect in the package:
          #
          #   a) the registry has not finished making the version visible -
          #      `npm view` and `npm install` read different CDN-cached
          #      documents, so a just-published version can answer ETARGET for
          #      minutes while the publish itself already succeeded;
          #   b) the published package really cannot be installed.
          #
          # The first release run of this workflow conflated them into one retry
          # loop and failed a publish that had worked: eight attempts across 150s
          # all returned ETARGET, the package installed fine in 25s locally, and
          # the red run told nobody that 0.2.2 was actually live. So: wait for
          # visibility first (generously, and it is NOT a package failure), then
          # install once, and treat an install failure after visibility as real.
          echo "::group::waiting for the registry to publish $VERSION"
          visible=no
          for attempt in $(seq 1 30); do
            if npm view --prefer-online "dsh-plugin-status-board@$VERSION" version >/dev/null 2>&1; then
              visible=yes
              echo "visible after $attempt attempt(s)"
              break
            fi
            echo "attempt $attempt/30: not visible yet"
            sleep 20
          done
          echo "::endgroup::"

          if [ "$visible" != yes ]; then
            # Ambiguous by construction, so say which of the two it might be and
            # send the human to check the registry rather than asserting a cause.
            echo "::error::$VERSION is still not visible on the registry after 10 minutes. Check https://www.npmjs.com/package/dsh-plugin-status-board before assuming the publish failed - the publish step reported success."
            exit 1
          fi

          dir=$(mktemp -d)
          cd "$dir"
          npm init -y >/dev/null
          # Past visibility, a failure here is a real packaging defect, so one
          # attempt is enough and its output is the diagnostic.
          if ! npm install --no-audit --no-fund --prefer-online "dsh-plugin-status-board@$VERSION"; then
            echo "::error::$VERSION is visible on the registry but cannot be installed - this is a packaging defect"
            exit 1
          fi
          test -f node_modules/dsh-plugin-status-board/lib/client.js
          test -f node_modules/dsh-plugin-status-board/lib/index.js
          test -f node_modules/dsh-plugin-status-board/cordis.patch.yml
          # The published package is `"type": "module"`, so the Host half is
          # ESM: load it with `import()`, which is how the Cordis Loader actually
          # consumes it. `require()` of ESM depends on the Node version.
          node --input-type=module -e "
            const m = await import('./node_modules/dsh-plugin-status-board/lib/index.js');
            if (typeof m.apply !== 'function') throw new Error('published Host half does not export apply()');
            if (m.Config === undefined) throw new Error('published Host half does not export Config');
          "
          # Provenance is the point of publishing from CI, so assert it landed
          # instead of trusting that `--provenance` was on the command line.
          node --input-type=module -e "
            const r = await fetch('https://registry.npmjs.org/-/npm/v1/attestations/dsh-plugin-status-board@${VERSION}');
            if (!r.ok) throw new Error('no provenance attestation is reachable for ${VERSION} (HTTP ' + r.status + ')');
            const { attestations } = await r.json();
            if (!attestations?.length) throw new Error('attestation list is empty');
            console.log('provenance attestation present');
          "
          echo "installed and loaded dsh-plugin-status-board@$VERSION"
