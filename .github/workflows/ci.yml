# Continuous integration: typecheck → build (with the post-build smoke check) →
# test → pack. The steps are deliberately separate so a red run names the stage
# that broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup refuses to run when the
      # workflow and package.json's `packageManager` both pin a version, and
      # `packageManager` is the single source of truth: it carries the integrity
      # hash, which a workflow-level `version:` cannot express.
      - uses: pnpm/action-setup@v4

      # Node 24: the major this package is built and released on.
      #
      # The build no longer depends on which Node runs it, because
      # `tsdown.config.mjs` is plain ESM and tsdown therefore never needs a
      # type-stripping loader. If that file is ever renamed back to `.ts`, the
      # build starts depending on `process.features.typescript` plus an optional
      # peer that is not installed, and CI goes red while modern machines stay
      # green - the exact failure this repo shipped with for its first nine runs.
      # The note at the top of tsdown.config.mjs records the mechanism.
      #
      # This does NOT weaken the supported runtime: `engines.node: >=20` is about
      # the Node that hosts the plugin inside Harness, and it is asserted by the
      # Host half being emitted with `target: node20`. 24 is simply the toolchain
      # floor (tsdown/rolldown bindings require ^20.19 || >=22.12).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build BEFORE the test step: `tests/artifacts.test.ts` asserts the built
      # artefacts and skips itself when `lib/` is absent. Running tests first
      # would let those nine contract checks pass silently by never running.
      - name: Build (includes the loader-envelope smoke check)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify packed file list
        run: npm pack --dry-run
