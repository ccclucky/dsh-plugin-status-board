# Continuous integration: typecheck → build (with the post-build smoke check) →
# test → pack. The steps are deliberately separate so a red run names the stage
# that broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup refuses to run when the
      # workflow and package.json's `packageManager` both pin a version, and
      # `packageManager` is the single source of truth: it carries the integrity
      # hash, which a workflow-level `version:` cannot express.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build BEFORE the test step: `tests/artifacts.test.ts` asserts the built
      # artefacts and skips itself when `lib/` is absent. Running tests first
      # would let those nine contract checks pass silently by never running.
      - name: Build (includes the loader-envelope smoke check)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify packed file list
        run: npm pack --dry-run